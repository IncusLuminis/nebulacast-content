<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Nebulacast Media Library</title>
  <style>
    :root {
      --bg: #03070d;
      --panel: #09131f;
      --line: #17354a;
      --text: #e8f5ff;
      --muted: #7890a3;
      --cyan: #62e8ff;
      --magenta: #df72ff;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      background:
        radial-gradient(circle at 12% 0%, #10283b 0, transparent 34rem),
        radial-gradient(circle at 88% 20%, #241436 0, transparent 30rem),
        var(--bg);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body::before {
      position: fixed;
      inset: 0;
      pointer-events: none;
      content: "";
      opacity: .16;
      background-image: linear-gradient(rgba(98,232,255,.12) 1px, transparent 1px), linear-gradient(90deg, rgba(98,232,255,.12) 1px, transparent 1px);
      background-size: 42px 42px;
      mask-image: linear-gradient(to bottom, black, transparent 78%);
    }

    main { width: min(1480px, calc(100% - 40px)); margin: 0 auto; padding: 64px 0 80px; }

    header { display: flex; gap: 32px; align-items: end; justify-content: space-between; margin-bottom: 30px; }
    .eyebrow { margin: 0 0 10px; color: var(--cyan); font: 700 12px/1 monospace; letter-spacing: .2em; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(34px, 6vw, 72px); line-height: .95; letter-spacing: -.055em; }
    .summary { color: var(--muted); text-align: right; font: 13px/1.6 monospace; }

    .controls {
      position: sticky;
      top: 12px;
      z-index: 3;
      display: flex;
      gap: 10px;
      padding: 10px;
      margin-bottom: 24px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: rgba(4, 12, 20, .86);
      backdrop-filter: blur(18px);
    }

    input, button {
      min-height: 42px;
      border: 1px solid var(--line);
      border-radius: 10px;
      color: var(--text);
      background: #07111b;
      font: inherit;
    }
    input { flex: 1; min-width: 120px; padding: 0 14px; outline: none; }
    input:focus { border-color: var(--cyan); box-shadow: 0 0 0 3px rgba(98,232,255,.1); }
    button { padding: 0 16px; cursor: pointer; }
    button:hover, button.active { color: #021017; border-color: var(--cyan); background: var(--cyan); }

    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 18px; }
    .folder-card { min-height: 180px; padding: 24px; border: 1px solid var(--line); border-radius: 16px; color: var(--text); background: linear-gradient(145deg, rgba(12,28,42,.96), rgba(5,13,22,.96)); text-align: left; }
    .folder-card:hover { color: var(--text); border-color: var(--cyan); background: linear-gradient(145deg, rgba(18,46,65,.98), rgba(7,20,32,.98)); }
    .folder-icon { display: block; margin-bottom: 28px; color: var(--cyan); font: 42px/1 sans-serif; }
    .folder-name { display: block; margin-bottom: 8px; font-size: 22px; font-weight: 700; text-transform: capitalize; }
    .folder-meta { color: var(--muted); font: 12px/1.4 monospace; }
    .card { overflow: hidden; border: 1px solid var(--line); border-radius: 16px; background: linear-gradient(145deg, rgba(12,28,42,.96), rgba(5,13,22,.96)); box-shadow: 0 24px 70px rgba(0,0,0,.22); }
    .preview { display: grid; place-items: center; width: 100%; aspect-ratio: 16/9; overflow: hidden; background: #020509; }
    .preview img, .preview video { width: 100%; height: 100%; object-fit: contain; }
    .details { padding: 15px 16px 17px; }
    .title { margin: 0 0 8px; overflow-wrap: anywhere; font-size: 15px; }
    .meta { display: flex; gap: 8px; align-items: center; color: var(--muted); font: 11px/1.4 monospace; text-transform: uppercase; }
    .format { padding: 3px 6px; border: 1px solid rgba(223,114,255,.45); border-radius: 5px; color: var(--magenta); }
    .path { display: block; margin-top: 12px; color: var(--cyan); font: 11px/1.5 monospace; overflow-wrap: anywhere; text-decoration: none; }
    .path:hover { text-decoration: underline; }

    .breadcrumb { display: flex; gap: 10px; align-items: center; min-height: 42px; margin-bottom: 18px; color: var(--muted); font: 13px/1.4 monospace; }
    .breadcrumb button { min-height: 36px; padding: 0 12px; }
    .breadcrumb strong { color: var(--text); text-transform: capitalize; }
    .type-filters[hidden], .breadcrumb[hidden] { display: none; }

    .empty, .error { grid-column: 1/-1; padding: 70px 24px; border: 1px dashed var(--line); border-radius: 16px; color: var(--muted); text-align: center; }
    .error { color: #ff91a8; }

    @media (max-width: 700px) {
      main { width: min(100% - 24px, 1480px); padding-top: 34px; }
      header { display: block; }
      .summary { margin-top: 18px; text-align: left; }
      .controls { flex-wrap: wrap; }
      input { flex-basis: 100%; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <p class="eyebrow">media-nebulacast.pages.dev</p>
        <h1>Media Library</h1>
      </div>
      <div class="summary" id="summary">Loading catalog…</div>
    </header>

    <div class="controls" aria-label="Library filters">
      <input id="search" type="search" placeholder="Search files and folders…" autocomplete="off">
      <div class="type-filters" id="type-filters" hidden>
        <button type="button" class="active" data-filter="all">All</button>
        <button type="button" data-filter="video">Video</button>
        <button type="button" data-filter="image">Images</button>
      </div>
    </div>

    <nav class="breadcrumb" id="breadcrumb" aria-label="Current folder" hidden>
      <button type="button" id="back-to-folders">← All folders</button>
      <span>/</span>
      <strong id="current-folder"></strong>
    </nav>
    <section class="grid" id="library" aria-live="polite"></section>
  </main>

  <script>
    const library = document.querySelector("#library");
    const summary = document.querySelector("#summary");
    const search = document.querySelector("#search");
    const buttons = [...document.querySelectorAll("[data-filter]")];
    const typeFilters = document.querySelector("#type-filters");
    const breadcrumb = document.querySelector("#breadcrumb");
    const currentFolderLabel = document.querySelector("#current-folder");
    const backToFolders = document.querySelector("#back-to-folders");
    let assets = [];
    let assetPaths = new Set();
    let filter = "all";
    let currentFolder = null;

    const escapeHtml = (value) => String(value).replace(/[&<>'"]/g, character => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", "'": "&#39;", '"': "&quot;"
    })[character]);

    const formatBytes = (bytes) => {
      if (!bytes) return "0 B";
      const units = ["B", "KB", "MB", "GB"];
      const unit = Math.min(Math.floor(Math.log(bytes) / Math.log(1024)), units.length - 1);
      return `${(bytes / 1024 ** unit).toFixed(unit ? 1 : 0)} ${units[unit]}`;
    };

    const folderOf = (asset) => asset.path.includes("/") ? asset.path.split("/")[0] : "root";

    const renderFolders = (query) => {
      const folders = [...new Set(assets.map(folderOf))].sort();
      const visible = folders.filter(folder => {
        if (!query) return true;
        return folder.toLowerCase().includes(query) || assets.some(asset =>
          folderOf(asset) === folder && (asset.path.toLowerCase().includes(query) || asset.title.toLowerCase().includes(query))
        );
      });

      if (!visible.length) {
        library.innerHTML = `<div class="empty">No matching folders.</div>`;
        return;
      }

      library.innerHTML = visible.map(folder => {
        const folderAssets = assets.filter(asset => folderOf(asset) === folder);
        const videos = folderAssets.filter(asset => asset.type === "video").length;
        const images = folderAssets.length - videos;
        return `<button type="button" class="folder-card" data-folder="${escapeHtml(folder)}">
          <span class="folder-icon" aria-hidden="true">▰</span>
          <span class="folder-name">${escapeHtml(folder)}</span>
          <span class="folder-meta">${folderAssets.length} files · ${videos} video · ${images} images</span>
        </button>`;
      }).join("");
    };

    const render = () => {
      const query = search.value.trim().toLowerCase();
      if (!currentFolder) {
        renderFolders(query);
        return;
      }
      const visible = assets.filter(asset =>
        folderOf(asset) === currentFolder &&
        (filter === "all" || asset.type === filter) &&
        (!query || asset.path.toLowerCase().includes(query) || asset.title.toLowerCase().includes(query))
      );

      if (!visible.length) {
        library.innerHTML = `<div class="empty">${assets.length ? "No matching media." : "The library is empty. Add WebM, MP4, JPG or PNG files to media/ and deploy again."}</div>`;
        return;
      }

      library.innerHTML = visible.map(asset => {
        const path = escapeHtml(asset.path);
        const mp4FallbackPath = asset.format === "webm"
          ? asset.path.replace(/\.webm$/i, ".mp4")
          : null;
        const mp4Fallback = mp4FallbackPath && assetPaths.has(mp4FallbackPath)
          ? `<source src="${escapeHtml(mp4FallbackPath)}" type="video/mp4">`
          : "";
        const preview = asset.type === "video"
          ? `<video controls preload="metadata" muted playsinline>
              <source src="${path}" type="video/${asset.format}">
              ${mp4Fallback}
              Your browser does not support HTML video.
            </video>`
          : `<img src="${path}" alt="" loading="lazy">`;
        return `<article class="card">
          <a class="preview" href="${path}">${preview}</a>
          <div class="details">
            <h2 class="title">${escapeHtml(asset.title)}</h2>
            <div class="meta"><span class="format">${escapeHtml(asset.format)}</span><span>${formatBytes(asset.size)}</span></div>
            <a class="path" href="${path}">${path}</a>
          </div>
        </article>`;
      }).join("");
    };

    search.addEventListener("input", render);
    library.addEventListener("click", event => {
      const folderButton = event.target.closest("[data-folder]");
      if (!folderButton) return;
      currentFolder = folderButton.dataset.folder;
      currentFolderLabel.textContent = currentFolder;
      breadcrumb.hidden = false;
      typeFilters.hidden = false;
      search.value = "";
      search.placeholder = `Search in ${currentFolder}…`;
      render();
    });
    backToFolders.addEventListener("click", () => {
      currentFolder = null;
      filter = "all";
      buttons.forEach(button => button.classList.toggle("active", button.dataset.filter === "all"));
      breadcrumb.hidden = true;
      typeFilters.hidden = true;
      search.value = "";
      search.placeholder = "Search folders and files…";
      render();
    });
    buttons.forEach(button => button.addEventListener("click", () => {
      filter = button.dataset.filter;
      buttons.forEach(candidate => candidate.classList.toggle("active", candidate === button));
      render();
    }));

    fetch("library.json", { cache: "no-store" })
      .then(response => {
        if (!response.ok) throw new Error(`Catalog request failed: ${response.status}`);
        return response.json();
      })
      .then(catalog => {
        assets = catalog.assets || [];
        assetPaths = new Set(assets.map(asset => asset.path));
        const videos = assets.filter(asset => asset.type === "video").length;
        const images = assets.length - videos;
        summary.innerHTML = `${assets.length} assets<br>${videos} video · ${images} images`;
        render();
      })
      .catch(error => {
        summary.textContent = "Catalog unavailable";
        library.innerHTML = `<div class="error">${escapeHtml(error.message)}</div>`;
      });
  </script>
</body>
</html>
